name: Send Daily Panchanga

on:
  schedule:
    # Runs everyday at 8:05 PM IST (14:35 UTC) for testing
    - cron: '35 14 * * *'
  workflow_dispatch: # Allows you to test it manually anytime from GitHub

jobs:
  send-telegram-notification:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Run Panchanga sender script
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          python send_panchanga.py
